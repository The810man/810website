name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      # Archive.otf may not be redistributed (Fontfabric EULA), so it isn't in
      # this public repo. It's stored base64-encoded in the ARCHIVE_FONT_B64
      # repository secret and written back here before the build.
      - name: Restore licensed fonts
        env:
          ARCHIVE_FONT_B64: ${{ secrets.ARCHIVE_FONT_B64 }}
        run: |
          if [ -z "$ARCHIVE_FONT_B64" ]; then
            echo "::error::Repository secret ARCHIVE_FONT_B64 is missing (see README > Fonts)"
            exit 1
          fi
          echo "$ARCHIVE_FONT_B64" | base64 -d > assets/fonts/Archive.otf

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /

      - name: Add custom domain
        run: echo "810-studios.com" > build/web/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
