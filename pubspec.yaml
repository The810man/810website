name: eight_ten_studios

description: Flutter port of 810 Studios homepage

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.2
  freezed_annotation: ^2.2.0
  flutter_hooks: ^0.18.6
  hooks_riverpod: ^2.3.2
  url_launcher: ^6.1.7
  flutter_svg: ^2.3.0

  # For icons, you might substitute your preferred package or custom icons
  lucide_icons: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.3.3
  freezed: ^2.2.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/images/branding/
    - assets/images/projects/
